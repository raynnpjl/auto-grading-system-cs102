# The assessment being graded. To grade a different assessment, copy this file to
# config/assessment.properties in the folder the application is started from, or pass
# -Dassessment.config=<path>, and describe its questions below.

# Folder name students are told to rename to their username.
assessment.template-folder=RenameToYourUsername
# Questions in grading order. Each question has a tester named <id>Tester.java.
assessment.questions=Q1a,Q1b,Q2a,Q2b,Q3

# For each question: the folder it belongs in, the student's source files, the support
# classes and data files the tester needs (comma-separated, may be empty), and the most a
# student can score on it (marks; optional, shown as "9/20" when every question has it).
question.Q1a.marks=3
question.Q1a.folder=Q1
question.Q1a.sources=Q1a.java

question.Q1b.marks=3
question.Q1b.folder=Q1
question.Q1b.sources=Q1b.java

question.Q2a.marks=5
question.Q2a.folder=Q2
question.Q2a.sources=Q2a.java
question.Q2a.runtime-files=personstester.txt

question.Q2b.marks=5
question.Q2b.folder=Q2
question.Q2b.sources=Q2b.java
question.Q2b.support-classes=DataException.class
question.Q2b.runtime-files=studentstester.txt

question.Q3.marks=4
question.Q3.folder=Q3
question.Q3.sources=Q3.java,ShapeComparator.java
question.Q3.support-classes=Shape.class,Circle.class,Rectangle.class
