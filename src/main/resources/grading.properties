# Grading settings. To change them without rebuilding, copy this file to
# config/grading.properties in the folder the application is started from, or pass
# -Dgrading.config=<path>. Values missing from that copy keep the defaults below.

# Time limits for each javac and tester run.
grading.compile-timeout-seconds=30
grading.execution-timeout-seconds=5
# Students graded at the same time. Each runs one JVM of up to 256 MB at a time, so lower
# this on machines with little memory; 1 grades one student at a time.
grading.parallel-students=4
# Output kept from each stdout/stderr stream before a run is stopped (1 MiB).
grading.max-output-bytes=1048576

# Limits that protect the application from oversized or malicious submissions.
submission.max-java-file-bytes=2097152
submission.max-zip-bytes=524288000
submission.max-zip-entries=10000
# Used to complete a student email address that is missing from a Java header.
submission.email-domain=smu.edu.sg

tester.max-file-bytes=2097152

# Folder under the system temporary directory that holds normalized submissions.
workspace.folder=cs102-auto-grading
# Characters of process output kept in the on-screen log.
ui.max-log-characters=100000

# Style scoring (CS102 Java Coding Style guide). Paths are relative to the folder the
# application is started from.
style.checkstyle-config=config/checkstyle.xml
# Guide section, plain-language text and weight of each rule, and the rules not checked.
style.rules=config/style-rules.properties
# The instructor's template sources; lines a student kept from them are not style-checked.
style.template-folder=config/template
# Style score out of this many points; each violation deducts its rule's weight.
style.max-score=10

# Penalties deducted from the tester marks. 0 means style is reported only and marks are unchanged.
penalty.style-per-violation=0
# The most a student can lose to style penalties.
penalty.style-cap=0

# Folder that receives one sub-folder of reports per grading attempt.
reports.folder=grading-reports
