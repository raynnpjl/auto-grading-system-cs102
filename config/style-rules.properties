# Style rules of the CS102 Java Coding Style guide (https://smu.sg/cs102-coding-style).
#
# For each check id used in config/checkstyle.xml:
#   <id>.section    the guide section it enforces
#   <id>.rule       the rule in plain language, as shown in student reports
#   <id>.weight     style points deducted per violation (style score = max-score - weighted violations)
#   <id>.heuristic  true when the check can be wrong and its findings need a human look
#
# Guide rules that cannot be checked automatically are listed under unchecked.<n> and are named
# in every report as "not automatically checked".

line-length.section=1. Line Length
line-length.rule=Lines are at most 80 characters long.
line-length.weight=0.5

wrap-after-comma.section=1. Line Length
wrap-after-comma.rule=When a line is too long, break it after a comma.
wrap-after-comma.weight=0.5

wrap-before-operator.section=1. Line Length
wrap-before-operator.rule=When a line is too long, break it before an operator.
wrap-before-operator.weight=0.5

one-statement-per-line.section=2. Simple Statements
one-statement-per-line.rule=Each line contains at most one statement.
one-statement-per-line.weight=1

one-declaration-per-line.section=3. Variable Declaration
one-declaration-per-line.rule=Declare one variable per line.
one-declaration-per-line.weight=1

initialise-at-declaration.section=3. Variable Declaration
initialise-at-declaration.rule=Declare and initialise a variable together; always initialise variables.
initialise-at-declaration.weight=1

variable-names.section=4. Meaningful variable names
variable-names.rule=Variable names are lowerCamelCase and longer than one character (except loop counters).
variable-names.weight=1

method-names.section=4. Meaningful variable names
method-names.rule=Method names are lowerCamelCase.
method-names.weight=1

magic-numbers.section=4. Meaningful variable names
magic-numbers.rule=Do not use magic numbers; name them as constants.
magic-numbers.weight=0.5

indentation.section=5. Indentation
indentation.rule=Indent each level by 4 spaces.
indentation.weight=0.5

no-tabs.section=5. Indentation
no-tabs.rule=Indent with spaces, never tabs.
no-tabs.weight=0.5

braces-always.section=5. Indentation
braces-always.rule=Use curly braces even for single-statement blocks.
braces-always.weight=1

kr-braces.section=5. Indentation
kr-braces.rule=Place braces K&R style: '{' at the end of the line, '}' before else on the same line.
kr-braces.weight=0.5

declare-near-use.section=6. Blank Lines
declare-near-use.rule=Declare variables as close to their first use as possible.
declare-near-use.weight=0.5

spaces-around-operators.section=7. Blank Space
spaces-around-operators.rule=Separate binary operators from their operands with spaces.
spaces-around-operators.weight=0.5

unary-operators.section=7. Blank Space
unary-operators.rule=Do not separate unary operators (such as -, ++ and --) from their operands.
unary-operators.weight=0.5

loop-edge-conditional.section=8. for loops
loop-edge-conditional.rule=Do not use a conditional inside a loop to run code only on the first or last iteration.
loop-edge-conditional.weight=1
loop-edge-conditional.heuristic=true

statement-form.section=9. if, if-else / 10. for loops
statement-form.rule=Put a space after if, else, for and while, and before '{'.
statement-form.weight=0.5

no-boolean-equality.section=9. if, if-else, if-else-if-else
no-boolean-equality.rule=Do not compare boolean values with true or false.
no-boolean-equality.weight=1

empty-branch.section=9. if, if-else, if-else-if-else
empty-branch.rule=Rewrite branching logic so that no branch is empty.
empty-branch.weight=1

nested-if-depth.section=9. if, if-else, if-else-if-else
nested-if-depth.rule=Do not nest if statements that can be written as one (else-if or &&).
nested-if-depth.weight=1

infinite-loop-exit.section=10. for loops
infinite-loop-exit.rule=Do not use break or continue to leave an infinite loop; put the condition in the loop header.
infinite-loop-exit.weight=1

simplified-boolean-return.section=11. Returning values
simplified-boolean-return.rule=Return a boolean expression directly instead of returning true or false from an if.
simplified-boolean-return.weight=1

# Guide rules that are not checked automatically.
unchecked.1=1. Line Length | Align a wrapped line with the start of the expression it continues.
unchecked.2=4. Meaningful variable names | Names are meaningful and avoid unfamiliar abbreviations.
unchecked.3=6. Blank Lines | Leave a blank line after each logical chunk of code.
unchecked.4=9. if, if-else, if-else-if-else | Do not write a branch that does nothing (such as x += 0).
unchecked.5=9. if, if-else, if-else-if-else | Write "else { if ... }" as "else if".
unchecked.6=9. if, if-else, if-else-if-else | Use if-else-if-else when only one block should run.
unchecked.7=10. for loops | Do not put unrelated statements in a for loop header.
unchecked.8=12. Methods | Use the early-return pattern for invalid values instead of nesting.
